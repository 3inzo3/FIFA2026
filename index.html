<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8" />
<!-- Mobile-first: pritaikyta telefonui (iPhone Pro Max), be priartinimo problemų -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0E1318" />
<!-- „Įsidiegimas" į telefoną (PWA / pridėti į pagrindinį ekraną) -->
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MZN World Cup" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-180.png" />
<title>MZN World Cup</title>
<style>
  /* ===================================================================
     STILIAI (CSS)
     Tamsi, švari paletė „Orai" stiliumi: gilus fonas, kortelės,
     auksinis akcentas, minimalus triukšmas, geri tarpai.
     =================================================================== */
  :root {
    --bg:      #0E1318;   /* gilus tamsus fonas */
    --card:    #19222C;   /* kortelės */
    --card-2:  #1F2A36;   /* gilesnis elementas kortelėje */
    --line:    #263340;   /* linijos / rėmeliai */
    --text:    #E8EDF2;   /* pagrindinis tekstas */
    --muted:   #8A97A6;   /* antrinis (pilkas) tekstas */
    --gold:    #E5B567;   /* akcentas (auksinis) */
    --green:   #34D399;   /* kyla / žemas hype */
    --yellow:  #FBBF24;   /* galimai kyla / vidutinis hype */
    --red:     #F87171;   /* aukštas hype / live */
    --radius:  16px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }

  body {
    /* Sisteminis šriftas — greitas, be papildomų bibliotekų */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    /* Saugios zonos iPhone „notch" / apatinei juostai */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* Subtilus auksinis švytėjimas viršuje – gylio pojūtis */
  body::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: 440px; pointer-events: none; z-index: 0; background: radial-gradient(120% 100% at 50% -45%, rgba(229,181,103,.09), transparent 62%); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 14px 40px; position: relative; z-index: 1; }

  /* ---------- Antraštė ---------- */
  header { margin-bottom: 14px; }
  .title {
    font-size: 26px; font-weight: 800; letter-spacing: 0.3px;
    display: flex; align-items: center; gap: 10px;
  }
  .title .ball { font-size: 20px; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; background: var(--card); border: 1px solid var(--line); border-radius: 11px; }
  /* Auksinė gradientinė antraštė – „prabangesnis" akcentas */
  .title .accent { color: var(--gold); background: linear-gradient(135deg, #F4D58A 0%, #E5B567 45%, #CF9A41 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

  .subrow {
    margin-top: 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  #todayDate { color: var(--muted); font-size: 13px; }

  .btn {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background .15s, opacity .15s;
  }
  .btn:active { background: var(--card-2); }
  .btn[disabled] { opacity: .55; cursor: default; }
  #refreshBtn { display: inline-flex; align-items: center; gap: 7px; }

  /* ---------- Tab'ai (skiltys) ---------- */
  nav.tabs {
    margin-top: 14px; display: flex; gap: 6px; background: var(--card);
    padding: 5px; border-radius: 14px; border: 1px solid var(--line);
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1 0 auto; white-space: nowrap;
    border: none; background: transparent; color: var(--muted);
    padding: 9px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .tab.active { background: var(--card-2); color: var(--gold); }

  /* ---------- Būsenos juosta (kraunasi / klaida) ---------- */
  #status { margin: 16px 0; }
  .state-box {
    display: flex; align-items: center; gap: 12px; justify-content: center;
    padding: 22px 16px; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); color: var(--muted); text-align: center;
  }
  .state-box.error { color: var(--text); border-color: #5a2d2d; background: #241a1c; flex-direction: column; }
  .state-box.notice { color: var(--text); border-color: #5a4a2d; background: #221d14; font-size: 13.5px; line-height: 1.5; }
  .state-box.error .msg { color: var(--red); font-weight: 700; }
  .state-box .sub { font-size: 13px; color: var(--muted); }
  /* Paprastas sukimosi indikatorius */
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2.5px solid var(--line); border-top-color: var(--gold);
    animation: spin .8s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Sekcijos ---------- */
  section.tab-panel { display: none; }
  section.tab-panel.active { display: block; }

  /* ---------- Įrankių juosta (rūšiavimas) ---------- */
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar .label { font-size: 13px; color: var(--muted); }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .seg button {
    border: none; background: transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .seg button.active { background: var(--card-2); color: var(--text); }

  /* ---------- Dienos antraštė rungtynių sąraše ---------- */
  .day-head {
    margin: 18px 2px 8px; font-size: 13px; font-weight: 700; color: var(--gold);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .day-head:first-child { margin-top: 0; }

  /* ---------- „Kita rungtynė" herojaus kortelė ---------- */
  .hero {
    position: relative; border-radius: 18px; padding: 14px 16px 13px; margin-bottom: 16px;
    background: linear-gradient(160deg, #212c3a 0%, #151d26 100%);
    border: 1px solid rgba(229,181,103,.35);
    box-shadow: 0 14px 34px -18px rgba(0,0,0,.9), 0 0 42px -26px rgba(229,181,103,.5);
  }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .hero-label { font-size: 11px; font-weight: 800; letter-spacing: .6px; color: var(--gold); text-transform: uppercase; }
  .hero-body { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .hero-team { display: flex; flex-direction: column; align-items: center; gap: 7px; flex: 1; min-width: 0; }
  .hero-flag { font-size: 36px; line-height: 1; }
  .hero-nm { font-size: 14.5px; font-weight: 700; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hero-mid { flex: none; display: flex; align-items: baseline; gap: 5px; padding: 0 4px; }
  .hero-p { font-size: 19px; font-weight: 800; }
  .hero-p.ph { color: var(--green); } .hero-p.pa { color: #818cf8; }
  .hero-x { color: var(--muted); font-weight: 800; }
  .hero-vs { font-size: 18px; font-weight: 800; color: var(--muted); letter-spacing: 1px; }
  .hero-meta { margin-top: 13px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
  .hero-count { margin-left: auto; font-weight: 800; color: #fff; background: rgba(229,181,103,.15); border: 1px solid rgba(229,181,103,.32); border-radius: 999px; padding: 3px 11px; font-variant-numeric: tabular-nums; }

  /* ---------- Rungtynių kortelė ---------- */
  .match {
    background: linear-gradient(170deg, #1d2832 0%, #161e27 100%);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 10px;
    box-shadow: 0 8px 20px -16px rgba(0,0,0,.8);
  }
  .match .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .meta-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill {
    font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
    background: var(--card-2); color: var(--muted); border: 1px solid var(--line);
  }
  .pill.group { color: var(--gold); }
  .pill.ko { color: #c4b5fd; }  /* atkrintamųjų etapas – violetinė */
  .pill.live { color: #fff; background: #7f1d1d; border-color: #b91c1c; }
  .pill.live::before { content: "● "; color: var(--red); animation: blink 1s infinite; }
  .pill.done { color: var(--green); }
  @keyframes blink { 50% { opacity: .3; } }

  /* Hype ženkliukas — subtilus, spalvotas tik tekstas/fonas */
  .hype { font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
  .hype.low  { color: var(--green);  background: rgba(52,211,153,.12);  border-color: rgba(52,211,153,.25); }
  .hype.mid  { color: var(--yellow); background: rgba(251,191,36,.12);  border-color: rgba(251,191,36,.25); }
  .hype.high { color: #fb7185;       background: rgba(248,113,113,.13); border-color: rgba(248,113,113,.28); }

  /* Komandų eilutės */
  .teams { display: flex; flex-direction: column; gap: 8px; }
  .team-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .team { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .team .flag { font-size: 22px; width: 26px; text-align: center; flex: none; }
  .crest { width: 26px; height: 26px; object-fit: contain; flex: none; }
  .team .name { font-size: 16.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team.win .name { color: #fff; font-weight: 700; }
  .score { font-size: 19px; font-weight: 800; min-width: 22px; text-align: right; }
  .match .when { margin-top: 11px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .match .when .t { color: var(--text); font-weight: 700; }

  /* ---------- Lentelės (grupės) ---------- */
  .group-card { background: linear-gradient(170deg, #1d2832 0%, #161e27 100%); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 4px 8px; margin-bottom: 14px; overflow: hidden; box-shadow: 0 8px 20px -16px rgba(0,0,0,.8); }
  .group-title { font-size: 15px; font-weight: 800; padding: 8px 12px 4px; }
  .group-title .accent { color: var(--gold); }
  /* table-layout: fixed + colgroup — kad stulpeliai būtų vienodi ir nieko neišmuštų */
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  table.tbl th, table.tbl td { padding: 7px 2px; text-align: center; }
  table.tbl th { color: var(--muted); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: .2px; border-bottom: 1px solid var(--line); }
  table.tbl col.c-pos { width: 22px; }
  table.tbl col.c-stat { width: 24px; }
  table.tbl col.c-gf { width: 42px; }
  table.tbl col.c-pts { width: 32px; }
  table.tbl td.team-cell, table.tbl th.team-cell { text-align: left; padding-left: 8px; }
  /* Komandos langelis: vidinis „flex", kad vėliava + pavadinimas tilptų ir nesilaužytų */
  table.tbl .tc { display: flex; align-items: center; gap: 7px; min-width: 0; }
  table.tbl .tc .flag { font-size: 16px; flex: none; }
  table.tbl .tc .crest { width: 20px; height: 20px; }
  table.tbl .tc .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  table.tbl td.pts { font-weight: 800; color: var(--text); }
  table.tbl tr td { border-bottom: 1px solid rgba(38,51,64,.5); }
  table.tbl tr:last-child td { border-bottom: none; }
  /* Pozicijų žymėjimas kairiu kraštu */
  .pos { width: 18px; font-weight: 700; position: relative; }
  tr.adv td.pos  { color: var(--green); }
  tr.maybe td.pos { color: var(--yellow); }
  tr.adv  td.pos::before,
  tr.maybe td.pos::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 3px; }
  tr.adv  td.pos::before { background: var(--green); }
  tr.maybe td.pos::before { background: var(--yellow); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 2px 2px 14px; }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
  .legend .dot.g { background: var(--green); } .legend .dot.y { background: var(--yellow); }

  /* Reitingo ženkliukas prie komandos rungtynių kortelėje */
  .rank-chip { font-size: 11px; color: var(--muted); font-weight: 700; margin-left: 6px; flex: none; }

  /* Reitingų skiltis */
  .rk-info { font-size: 12.5px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; line-height: 1.55; }
  .rk-info b { color: var(--text); }
  .rk-list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .rk-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid rgba(38,51,64,.5); }
  .rk-row:last-child { border-bottom: none; }
  .rk-row .rkpos { width: 30px; color: var(--gold); font-weight: 800; font-size: 14px; text-align: center; flex: none; }
  .rk-row .flag { font-size: 19px; flex: none; }
  .rk-row .crest { width: 24px; height: 24px; }
  .rk-row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Laimėjimo tikimybės (1 / X / 2) rungtynių kortelėje */
  .probs { margin-top: 11px; }
  .pbar { display: flex; gap: 2px; height: 8px; }
  .pbar i { display: block; height: 100%; }
  .pbar i:first-child { border-radius: 999px 3px 3px 999px; }
  .pbar i:last-child { border-radius: 3px 999px 999px 3px; }
  .pbar .ph { background: var(--green); }
  .pbar .pd { background: #64748b; }
  .pbar .pa { background: #818cf8; }
  .xdraw { text-align: center; margin-top: 6px; font-size: 11px; font-weight: 700; color: #94a3b8; letter-spacing: .2px; }
  .winp { font-size: 16px; font-weight: 800; min-width: 46px; text-align: right; flex: none; }
  .winp.ph { color: var(--green); }
  .winp.pa { color: #818cf8; }
  .est { font-size: 11px; color: var(--muted); font-weight: 700; margin-right: 1px; }  /* „≈" – įvertis, ne realūs koef. */
  /* Baudinių rezultatas „(4)" ir užrašas */
  .score .pen { font-size: 13px; color: var(--muted); font-weight: 700; }
  .pen-note { margin-top: 10px; font-size: 12.5px; color: var(--gold); background: rgba(229,181,103,.08); border: 1px solid rgba(229,181,103,.22); border-radius: 9px; padding: 6px 10px; }
  .pen-note b { color: #fff; }
  .bk-pen { font-size: 10px; color: var(--muted); font-weight: 700; }

  /* ---------- Tinklelis (bracket) – klasikinis horizontalus medis ---------- */
  .bracket-note { font-size: 12.5px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; line-height: 1.5; }
  .bracket-note b { color: var(--text); }
  .bk-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 10px; }
  .bk-canvas { position: relative; }
  .bk-head { position: absolute; top: 0; text-align: center; font-size: 12px; font-weight: 800; color: var(--gold); text-transform: uppercase; letter-spacing: .4px; }
  .bk-head span { display: block; font-size: 10px; font-weight: 600; color: var(--muted); text-transform: none; letter-spacing: 0; margin-top: 2px; }
  .bk-line { position: absolute; background: var(--line); }
  .bk-tie { position: absolute; background: linear-gradient(170deg, #1d2832 0%, #161e27 100%); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 6px 16px -14px rgba(0,0,0,.8); }
  .bk-slot { display: flex; align-items: center; gap: 6px; padding: 0 8px; height: 50%; font-size: 12.5px; min-width: 0; }
  .bk-slot + .bk-slot { border-top: 1px solid var(--line); }
  .bk-slot .flag { font-size: 14px; width: 17px; text-align: center; flex: none; }
  .bk-slot .bk-nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 600; }
  .bk-slot.tbd .bk-nm { color: #5d6b7a; font-style: italic; }
  .bk-slot.lose .bk-nm { color: var(--muted); }
  .bk-slot.win { background: rgba(229,181,103,.10); }
  .bk-slot.win .bk-nm { color: #fff; font-weight: 800; }
  .bk-sc { flex: none; font-weight: 800; font-size: 13px; color: var(--text); }
  .bk-slot.lose .bk-sc { color: var(--muted); }
  .bk-pct { flex: none; font-size: 11px; font-weight: 700; color: var(--muted); }
  .bk-third { margin-top: 20px; max-width: 300px; }
  .bk-third-h { font-size: 12px; font-weight: 800; color: var(--gold); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; }
  .bk-third .bk-tie { position: static; width: auto !important; height: auto !important; }
  .bk-third .bk-slot { height: 36px; }

  /* ---------- Koeficientai (placeholder) ---------- */
  .soon { text-align: center; padding: 40px 18px; color: var(--muted); }
  .soon .big { font-size: 44px; margin-bottom: 10px; }
  .soon h2 { color: var(--text); margin: 0 0 6px; }
  .soon .tag { display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--gold); border: 1px solid var(--gold); border-radius: 999px; padding: 4px 12px; }

  /* ---------- Poraštė / diagnostika ---------- */
  footer.diag { margin-top: 26px; font-size: 11.5px; color: #5d6b7a; text-align: center; line-height: 1.6; }
  footer.diag code { color: var(--muted); }

  .empty { color: var(--muted); text-align: center; padding: 26px 16px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===================== ANTRAŠTĖ ===================== -->
  <header>
    <div class="title"><span class="ball">⚽</span><span>MZN <span class="accent">World Cup</span></span></div>
    <div class="subrow">
      <span id="todayDate">—</span>
      <button class="btn" id="refreshBtn">Atnaujinti</button>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="matches">Rungtynės</button>
      <button class="tab" data-tab="tables">Lentelės</button>
      <button class="tab" data-tab="bracket">Tinklelis</button>
      <button class="tab" data-tab="rankings">Reitingai</button>
    </nav>
  </header>

  <!-- Bendra būsenos juosta (kraunasi / klaida) -->
  <div id="status"></div>

  <!-- ===================== SKILTYS ===================== -->
  <main>
    <!-- 1) RUNGTYNĖS -->
    <section class="tab-panel active" id="tab-matches">
      <div class="toolbar">
        <span class="seg" id="filterSeg">
          <button data-filter="upcoming" class="active">Būsimos</button>
          <button data-filter="finished">Pasibaigusios</button>
        </span>
        <span class="seg" id="sortSeg">
          <button data-sort="time" class="active">Laikas</button>
          <button data-sort="hype">Hype 🔥</button>
        </span>
      </div>
      <div id="matchesList"></div>
    </section>

    <!-- 2) LENTELĖS -->
    <section class="tab-panel" id="tab-tables">
      <div class="legend">
        <span><span class="dot g"></span>1–2 vietos — kyla į atkrintamąsias</span>
        <span><span class="dot y"></span>3-ia vieta — galimai kyla</span>
      </div>
      <div id="tablesList"></div>
    </section>

    <!-- 3) TINKLELIS -->
    <section class="tab-panel" id="tab-bracket">
      <div class="bracket-note" id="bracketNote"></div>
      <div id="bracketRounds"></div>
    </section>

    <!-- 4) REITINGAI (FIFA reitingai + HYPE paaiškinimas) -->
    <section class="tab-panel" id="tab-rankings">
      <div class="rk-info" id="hypeInfo"></div>
      <div class="rk-list" id="rankingsList"></div>
    </section>

  </main>

  <!-- Poraštė: duomenų šaltinis ir diagnostika -->
  <footer class="diag" id="diag"></footer>

</div>

<script>
/* =====================================================================
   LOGIKA (JavaScript) — grynas vanilla JS + fetch, jokių bibliotekų.
   Komentarai lietuviškai — kad būtų aišku, ką kiekviena dalis daro.
   ===================================================================== */

// --------------------------------------------------------------------
// 1. KONFIGŪRACIJA
// --------------------------------------------------------------------
const CONFIG = {
  // TheSportsDB nemokamas v1 API (raktas „123"). Veikia tiesiai iš naršyklės.
  API_BASE: 'https://www.thesportsdb.com/api/v1/json/123/',
  VERSION: 'v25',               // versijos žymė (kad matytume, ar užsikrovė naujas variantas)
  LEAGUE_ID: '4429',            // FIFA World Cup lygos ID TheSportsDB sistemoje

// Vardo „normalizavimas": mažosios raidės, be kraštinių tarpų, be diakritikų
function normTeam(name) {
  if (!name) return '';
  let s = name.toString().trim().toLowerCase();
  s = s.normalize('NFD').replace(/[̀-ͯ]/g, ''); // nuimam diakritikus (č->c)
  s = s.replace(/[^a-z\s']/g, '').replace(/\s+/g, ' ').trim();
  return TEAM_ALIASES[s] || s;
}

// Vėliavos emoji pagal komandos vardą („", jei nežinoma)
function flagEmoji(name) {
  const iso = TEAM_ISO[normTeam(name)];
  if (!iso) return '\u{1F3F3}'; // balta vėliavėlė kaip neutralus ženklas
  if (iso.length > 2) return iso; // jau paruoštas emoji (Anglija ir pan.)
  // Du raidžių ISO kodą paverčiame „regional indicator" simboliais
  return String.fromCodePoint(...[...iso.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
}

// --------------------------------------------------------------------
// 5. HYPE BALAS (1–100) — skaičiuojame patys.
// --------------------------------------------------------------------
function teamRank(name) { return FIFA_RANK[normTeam(name)] || RANK_DEFAULT; }
// Reitingą verčiame į „stiprumą" 15–100 (1 vieta ~100, 50 vieta ~15)
function teamStrength(name) {
  const r = teamRank(name);
  return Math.max(15, Math.min(100, Math.round(105 - r * 1.8)));
}
function isBig(name) { return BIG_TEAMS.has(normTeam(name)); }

function computeHype(ev) {
  const s1 = teamStrength(ev.strHomeTeam);
  const s2 = teamStrength(ev.strAwayTeam);
  let h = ((s1 + s2) / 2) * 0.8; // bazė: kuo stipresnės ABI komandos, tuo daugiau

  // Bonusas už „didžiąsias" komandas
  const big = (isBig(ev.strHomeTeam) ? 1 : 0) + (isBig(ev.strAwayTeam) ? 1 : 0);
  h += big === 2 ? 14 : big === 1 ? 7 : 0;

  // Bonusas už lemiamas / atkrintamąsias rungtynes
  if (isKnockoutEvent(ev)) h += 15;                 // atkrintamosios
  else if (String(ev.intRound) === '3') h += 8;     // paskutinis (3-čias) grupės turas

  return Math.max(1, Math.min(100, Math.round(h)));
}
function hypeClass(h) { return h >= 70 ? 'high' : h >= 45 ? 'mid' : 'low'; }

// Komandos raktas koeficientų paieškai (be tarpų, kad sutaptų skirtingi vardai)
const oddsKey = s => normTeam(s).replace(/\s+/g, '');
// Komandų poros raktas (tvarka nesvarbi) — koeficientų ir API atkrintamųjų paieškai
const pairKey = (a, b) => [oddsKey(a), oddsKey(b)].sort().join('|');

// Realios laimėjimo tikimybės rungtynėms iš odds.json žemėlapio (arba null).
// Grupių etapas: 3-krypčių (1/X/2). Atkrintamosios: 2-krypčių „kas pereina" (be lygiųjų).
function oddsForEvent(ev) {
  const kh = oddsKey(ev.strHomeTeam), ka = oddsKey(ev.strAwayTeam);
  const v = STATE.odds[[kh, ka].sort().join('|')];
  if (!v) return null;
  const twoWay = (v.d == null);              // jei nėra lygiųjų – tai 2-krypčių
  return { ph: v[kh], pd: v.d, pa: v[ka], twoWay, est: false }; // ph=namų, pa=svečių (%)
}

// Apytikslė 2-krypčių „kas pereina toliau" tikimybė pagal FIFA reitingus.
// Naudojama TIK kai nėra realių koeficientų (pvz. dar nepaskelbti vėlesni etapai).
function koProb(home, away) {
  const sh = teamStrength(home), sa = teamStrength(away);
  const ph = 1 / (1 + Math.pow(10, (sa - sh) / 44)); // logistinė: stiprumo skirtumas -> tikimybė
  const h = Math.max(5, Math.min(95, Math.round(ph * 100)));
  return { ph: h, pa: 100 - h, twoWay: true, est: true };
}

// Tikimybės būsimoms rungtynėms: realūs koeficientai; jei jų nėra ir tai
// atkrintamosios – grąžiname įvertį pagal reitingus (pažymėtą „≈").
function winProbs(ev) {
  const od = oddsForEvent(ev);
  if (od) return od;
  if (isKnockoutEvent(ev)) return koProb(ev.strHomeTeam, ev.strAwayTeam);
  return null;
}

// --------------------------------------------------------------------
// 6. LAIKAS — konvertuojame į Lietuvos laiką (Europe/Vilnius).
//    Naudojame Intl su laiko juosta — taip automatiškai gaunamas EEST (UTC+3).
// --------------------------------------------------------------------
// Iš įvykio gauname JS Date objektą (UTC pagrindu)
function kickoffDate(ev) {
  // Pirmenybė strTimestamp (UTC). Jei nėra – dedame dateEvent + strTime kaip UTC.
  let raw = ev.strTimestamp || (ev.dateEvent && ev.strTime ? ev.dateEvent + ' ' + ev.strTime : ev.dateEvent);
  if (!raw) return null;
  raw = raw.trim().replace(' ', 'T');
  // Jei nenurodyta laiko juosta – laikome, kad tai UTC, ir pridedame „Z"
  if (!/[zZ]|[+\-]\d{2}:?\d{2}$/.test(raw)) raw += 'Z';
  const d = new Date(raw);
  return isNaN(d.getTime()) ? null : d;
}

// „YYYY-MM-DD" raktas pagal Lietuvos laiką (datų palyginimui)
function vilniusKey(d) {
  const p = new Intl.DateTimeFormat('en-CA', {
    timeZone: CONFIG.TZ, year: 'numeric', month: '2-digit', day: '2-digit',
  }).formatToParts(d);
  const get = t => p.find(x => x.type === t).value;
  return `${get('year')}-${get('month')}-${get('day')}`;
}
// Valanda:minutė pagal Lietuvos laiką
function vilniusTime(d) {
  return new Intl.DateTimeFormat('lt-LT', { timeZone: CONFIG.TZ, hour: '2-digit', minute: '2-digit' }).format(d);
}
// Ilgas datos užrašas (pvz., „birželio 16 d., antradienis")
function vilniusLongDate(d) {
  return new Intl.DateTimeFormat('lt-LT', { timeZone: CONFIG.TZ, day: 'numeric', month: 'long', weekday: 'long' }).format(d);
}
// Šios dienos ir rytojaus raktai (Lietuvos laiku)
function todayKey() { return vilniusKey(new Date()); }
function tomorrowKey() { return vilniusKey(new Date(Date.now() + 86400000)); }

// Patogus datos antraštės tekstas: „Šiandien" / „Rytoj" / data
function dayLabel(dateKey, sampleDate) {
  if (dateKey === todayKey()) return 'Šiandien';
  if (dateKey === tomorrowKey()) return 'Rytoj';
  return vilniusLongDate(sampleDate);
}

// --------------------------------------------------------------------
// 7. ĮVYKIŲ PAGALBINĖS FUNKCIJOS
// --------------------------------------------------------------------
// Kuriai grupei priklauso rungtynės? API neturi grupės lauko, todėl grupę
// nustatome pagal komandas: grupių etape ABI komandos yra iš tos pačios grupės,
// o turas (intRound) yra 1–3. Atkrintamosioms grąžina null.
function groupOf(ev) {
  // 1) jei API duoda grupę (eventsday turi „strGroup": "J" ar „Group J") – naudojam ją
  const m = (ev.strGroup || '').match(/^\s*([A-L])\s*$/i) || (ev.strGroup || '').match(/group\s*([a-l])/i);
  if (m) return m[1].toUpperCase();
  // 2) kitaip – nustatome pagal komandas (grupių etape abi iš tos pačios grupės, 1–3 turas)
  const h = TEAM_TO_GROUP[normTeam(ev.strHomeTeam)];
  const a = TEAM_TO_GROUP[normTeam(ev.strAwayTeam)];
  const r = String(ev.intRound);
  if (h && a && h === a && (r === '1' || r === '2' || r === '3')) return h;
  return null;
}
// Ar tai atkrintamosios? (tikros komandos, bet ne tos pačios grupės / ne 1–3 turas)
function isKnockoutEvent(ev) {
  return isRealTeam(ev.strHomeTeam) && isRealTeam(ev.strAwayTeam) && groupOf(ev) === null;
}
// Ar komandos vardas yra tikras (ne „TBD" / „Winner Match 73" ir pan.)?
function isRealTeam(name) {
  if (!name) return false;
  return !/^(tbd|winner|loser|runner|match\s*\d+|w\d|l\d|group\s)/i.test(name.trim());
}
// Ar yra galutinis rezultatas?
function hasScore(ev) {
  return ev.intHomeScore != null && ev.intHomeScore !== '' &&
         ev.intAwayScore != null && ev.intAwayScore !== '';
}
// Ar rungtynės baigtos baudiniais? (lygu po pagrindinio laiko + yra baudinių rezult.)
// TheSportsDB baudinių rezultatą laiko intHomeScoreExtra/intAwayScoreExtra, statusas „AP".
function wentToPens(ev) {
  return hasScore(ev) && +ev.intHomeScore === +ev.intAwayScore &&
         ev.intHomeScoreExtra != null && ev.intHomeScoreExtra !== '' &&
         ev.intAwayScoreExtra != null && ev.intAwayScoreExtra !== '';
}
// Kuri pusė laimėjo? 'home' / 'away' / null. Po lygiųjų lemia baudiniai.
function koWinnerSide(ev) {
  if (!hasScore(ev)) return null;
  const hs = +ev.intHomeScore, as = +ev.intAwayScore;
  if (hs > as) return 'home';
  if (as > hs) return 'away';
  if (wentToPens(ev)) {
    const hp = +ev.intHomeScoreExtra, ap = +ev.intAwayScoreExtra;
    if (hp > ap) return 'home';
    if (ap > hp) return 'away';
  }
  return null; // lygiosios (grupėse) arba neaišku
}
// Laimėtojos komandos vardas (arba null)
function koWinnerName(ev) {
  const s = koWinnerSide(ev);
  return s === 'home' ? ev.strHomeTeam : s === 'away' ? ev.strAwayTeam : null;
}
// Rungtynių statusas: 'done' (baigta) / 'live' (vyksta) / 'upcoming' (būsima)
function matchStatus(ev) {
  const st = (ev.strStatus || '').toUpperCase().trim();
  const FIN = ['FT', 'AET', 'AP', 'PEN', 'PENALTIES', 'MATCH FINISHED', 'FINISHED', 'AOT'];
  const LIVE = ['1H', '2H', 'HT', 'ET', 'LIVE', 'IN PLAY', 'P', 'BREAK', 'PEN.'];
  const d = kickoffDate(ev);
  const now = Date.now();

  if (FIN.includes(st)) return 'done';
  if (LIVE.includes(st)) return 'live';
  // Nėra aiškaus statuso (dažniausiai – tinklelio įvykis be API rezultato): sprendžiam
  // pagal laiką. SVARBU: praeitis BE rezultato NĖRA „būsima" – laikom, kad jau baigta.
  if (d) {
    const start = d.getTime();
    if (now < start) return 'upcoming';                 // dar neprasidėjo
    if (now <= start + 2.5 * 3600000) return 'live';    // per ~2,5 val. – greičiausiai vyksta
    return 'done';                                      // seniai prasidėjo – laikom baigta
  }
  if (hasScore(ev)) return 'done';
  return 'upcoming';
}

// --------------------------------------------------------------------
// Saugus JSON fetch — visada grąžina objektą arba null (niekada nemeta)
async function fetchJson(url) {
  try {
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) { console.warn('HTTP', res.status, url); return null; }
    return await res.json();
  } catch (e) {
    console.warn('fetch klaida:', url, e);
    return null;
  }
}

// Siunčia kelias užklausas, bet ne daugiau „limit" VIENU METU (su mažu tarpeliu).
// Nemokamas raktas „123" riboja lygiagrečias užklausas — per daug jų iškart
// (pvz. 8) „nulauždavo" net eventsround. Todėl siunčiam po nedaug ir iš eilės.
async function fetchAllLimited(urls, limit = 3, gapMs = 120) {
  const out = new Array(urls.length);
  let next = 0;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function worker() {
    while (next < urls.length) {
      const i = next++;
      let r = await fetchJson(urls[i]);
      if (r == null) { await sleep(500); r = await fetchJson(urls[i]); } // 1 pakartojimas (rate-limit?)
      out[i] = r;
      if (gapMs) await sleep(gapMs);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, urls.length) }, worker));
  return out;
}

// Paskutinių sėkmingų API įvykių įsiminimas (localStorage) — kad programėlė
// veiktų ir API'ui trumpam nutrūkus (rodytų paskutinius rezultatus, ne tuščią tvarkaraštį).
const CACHE_KEY = 'mzn_wc_cache_v1';
function saveCache(events) {
  try {
    // numetam sunkius/nereikalingus laukus (aprašymus, media), kad tilptų
    const slim = events.map(e => {
      const { strDescriptionEN, strVideo, strThumb, strBanner, strPoster, strMap, strFanart, strSquare, ...rest } = e;
      return rest;
    });
    localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), events: slim }));
  } catch (e) { /* localStorage gali būti neprieinamas – nieko tokio */ }
}
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    return (c && Array.isArray(c.events) && c.events.length) ? c : null;
  } catch (e) { return null; }
}

// Iš tinklelio aprašo (KO_R32) padaro „įvykio" objektą, suderinamą su likusiu
// kodu. Jei API jau turi tas rungtynes (pagal komandų porą) – paima realų
// laiką, statusą ir rezultatą (teisingai sukeičia namus/svečius, jei reikia).
function buildKoEvent(r, api) {
  const ev = {
    idEvent: 'ko-' + (r.m || pairKey(r.h, r.a)), idLeague: CONFIG.LEAGUE_ID,
    strHomeTeam: r.h, strAwayTeam: r.a,
    strTimestamp: r.ts, dateEvent: r.ts.slice(0, 10), strTime: r.ts.slice(11),
    intHomeScore: null, intAwayScore: null, strStatus: 'NS',
    _ko: r.m || null, _city: r.city,  // be numerio (QF+) etapas nustatomas pagal datą
  };
  if (api) {
    const sameOrient = normTeam(api.strHomeTeam) === normTeam(r.h);
    if (api.strTimestamp) ev.strTimestamp = api.strTimestamp;
    if (api.dateEvent) ev.dateEvent = api.dateEvent;
    if (api.strTime) ev.strTime = api.strTime;
    if (api.strStatus) ev.strStatus = api.strStatus;
    const hs = api.intHomeScore, as = api.intAwayScore;
    if (hs != null && hs !== '' && as != null && as !== '') {
      ev.intHomeScore = sameOrient ? hs : as;
      ev.intAwayScore = sameOrient ? as : hs;
    }
    // Baudinių rezultatas (taip pat teisingai sukeičiam, jei orientacija kita)
    const hx = api.intHomeScoreExtra, ax = api.intAwayScoreExtra;
    if (hx != null && hx !== '' && ax != null && ax !== '') {
      ev.intHomeScoreExtra = sameOrient ? hx : ax;
      ev.intAwayScoreExtra = sameOrient ? ax : hx;
    }
    if (api.strHomeTeamBadge) STATE.badges[normTeam(sameOrient ? r.h : r.a)] = api.strHomeTeamBadge;
    if (api.strAwayTeamBadge) STATE.badges[normTeam(sameOrient ? r.a : r.h)] = api.strAwayTeamBadge;
  }
  return ev;
}

// Pagrindinis įkėlimas. Nemokamas raktas „123" riboja „eventsseason" iki 15
// rungtynių, BET „eventsround" grąžina VISAS vieno turo rungtynes (po 24) su
// grupe ir rezultatais ir NĖRA ribojamas. 3 turai = visas grupių etapas (72).
// „next"/„past" papildomai pagauna atkrintamąsias, kai komandos paaiškės.
async function loadData() {
  STATE.loading = true; STATE.error = null; STATE.notice = null;
  renderStatus(); setRefreshing(true);

  const base = CONFIG.API_BASE, id = CONFIG.LEAGUE_ID;
  const arr = d => (d && Array.isArray(d.events)) ? d.events : [];

  // VISKĄ imame per „eventsround" — nemokamame rakte jis NERIBOJAMAS (skirtingai nei
  // eventsseason/past/next). Grupės: r=1,2,3. Atkrintamąsias TheSportsDB žymi PAGAL
  // KOMANDŲ SKAIČIŲ etape: 1/16=32, 1/8=16, ketvirtf.=8, pusf.=4, finalas=2.
  // Turus traukiame pagal kalendorių (žr. KO_ROUND_FETCH_FROM) — būsimą turą
  // pradedam traukti keliomis dienomis anksčiau, tolimų dar nesiunčiam (taupom
  // raktą, kad „nenumestų" grupių duomenų). Finalas (r=2) jau yra tarp grupių turų.
  const rounds = koFetchRounds(todayKey());
  STATE.diagTried = [`eventsround r=${rounds.join(',')} (po 3 vienu metu)`];

  const apiUrls = [
    ...rounds.map(r => `${base}eventsround.php?id=${id}&r=${r}&s=${CONFIG.SEASON}`),
    `${base}eventsnextleague.php?id=${id}`,   // būsimos KO (ketvirtf. ir toliau) – nepriklauso nuo turo numerio
    `${base}eventspastleague.php?id=${id}`,   // paskutinės baigtos – rezultatai
  ];
  const [oddsData, apiResults] = await Promise.all([
    fetchJson('odds.json?ts=' + Date.now()),  // vietinis failas; ?ts apeina naršyklės talpyklą
    fetchAllLimited(apiUrls, 3, 120),         // ne daugiau 3 vienu metu
  ]);

  // Koeficientų žemėlapis: rūšiuotas komandų raktas -> tikimybės pagal komandą
  STATE.odds = {};
  if (oddsData && Array.isArray(oddsData.matches)) {
    for (const m of oddsData.matches) {
      const kh = oddsKey(m.h), ka = oddsKey(m.a);
      STATE.odds[[kh, ka].sort().join('|')] = { [kh]: m.ph, [ka]: m.pa, d: m.pd };
    }
  }

  // Sujungiame visus turus be dublikatų (pagal idEvent) — grupės ir atkrintamosios.
  const byId = new Map();
  for (const d of apiResults) {
    for (const ev of arr(d)) if (ev && ev.idEvent && String(ev.idLeague) === id) byId.set(ev.idEvent, ev);
  }
  const apiEvents = [...byId.values()];
  // Sėkmė – įsimenam paskutinius; nesėkmė – rodom paskutinius įsimintus (ne tuščią tvarkaraštį).
  let events = apiEvents, staleAt = null;
  if (apiEvents.length) saveCache(apiEvents);
  else { const c = loadCache(); if (c) { events = c.events; staleAt = c.t; } }

  // Komandų herbai (logo) iš įvykių – naudosime juos vietoj vėliavų emoji
  STATE.badges = {};
  for (const ev of events) {
    if (ev.strHomeTeamBadge) STATE.badges[normTeam(ev.strHomeTeam)] = ev.strHomeTeamBadge;
    if (ev.strAwayTeamBadge) STATE.badges[normTeam(ev.strAwayTeam)] = ev.strAwayTeamBadge;
  }

  // Atkrintamosios. API jas grąžina pamažu (ir dažnai be tikrų komandų vardų),
  // todėl turą susidedame iš oficialaus tinklelio, o realų laiką/rezultatą
  // (jei jau yra) paimame iš API pagal komandų porą. Taip „Būsimos" rodo
  // VISAS likusias atkrintamųjų rungtynes, o ne vieną.
  STATE.koApi = new Map();
  for (const ev of events) {
    if (isKnockoutEvent(ev)) STATE.koApi.set(pairKey(ev.strHomeTeam, ev.strAwayTeam), ev);
  }
  // Atkrintamųjų tvarkaraštis: R32 iš tinklelio + vėlesni etapai iš odds.json
  // (kiekvienas įrašas su laiku „t": pora, laikas, %). Taip ketvirtfinaliai/
  // pusfinaliai/finalas rodosi nepriklausomai nuo to, ar TheSportsDB juos turi.
  const r32keys = new Set(KO_R32.map(r => pairKey(r.h, r.a)));
  const oddsFixtures = (oddsData && Array.isArray(oddsData.matches) ? oddsData.matches : [])
    .filter(m => m.t && !r32keys.has(pairKey(m.h, m.a)))
    .map(m => ({ h: m.h, a: m.a, ts: m.t, city: m.city || '' }));
  const koFixtures = [...KO_R32, ...oddsFixtures];
  const koEvents = koFixtures.map(r => buildKoEvent(r, STATE.koApi.get(pairKey(r.h, r.a))));
  // API atkrintamosios, kurių nėra mūsų tvarkaraštyje (pvz. baigtos 1/8 poros)
  const fixtureKeys = new Set(koFixtures.map(r => pairKey(r.h, r.a)));
  const koExtra = [...STATE.koApi.entries()].filter(([k]) => !fixtureKeys.has(k)).map(([, ev]) => ev);
  // Galutinis sąrašas: grupių etapas (iš API) + atkrintamosios (tinklelis + API)
  const groupEvents = events.filter(ev => groupOf(ev) !== null);
  const finalEvents = [...groupEvents, ...koEvents, ...koExtra];

  const groupCount = events.filter(ev => groupOf(ev) !== null).length;
  const koApiCount = events.filter(ev => isKnockoutEvent(ev)).length;
  STATE.endpointUsed = `eventsround[${rounds.join(',')}] · grupių ${groupCount} + KO API ${koApiCount} (tinkl. ${koEvents.length})`;

  STATE.events = finalEvents;
  STATE.groups = computeGroups(events);
  STATE.season = CONFIG.SEASON;
  STATE.error = null;
  if (!events.length) {
    // Nei API, nei atmintis — bent jau rodome atkrintamųjų tvarkaraštį iš tinklelio.
    STATE.notice = 'Gyvi duomenys kol kas nepasiekiami — rodomas atkrintamųjų tvarkaraštis. Spausk „Atnaujinti".';
  } else if (staleAt) {
    // API neatsakė, bet turime įsimintus duomenis — parodom juos su žyme.
    STATE.notice = `Rodomi paskutiniai įsiminti duomenys (${vilniusTime(new Date(staleAt))}). API laikinai neatsakė — spausk „Atnaujinti".`;
  }
  console.log(`${events.length} įvykiai · ${STATE.endpointUsed}${staleAt ? ' · iš atminties' : ''}`);

  STATE.loading = false; setRefreshing(false); renderAll();
}

// --------------------------------------------------------------------
// 9. GRUPIŲ LENTELĖS — apskaičiuojame PATYS iš baigtų rungtynių.
//    Taip lentelės visada sutampa su rodomais rezultatais ir nepriklauso
//    nuo atskiro „lookuptable" endpointo (kuris nemokamame rakte ne visada veikia).
// --------------------------------------------------------------------
function computeGroups(events) {
  const groups = {};

  // 1) Iš pradžių sudedame VISAS komandas pagal oficialų grupių sąrašą
  //    (kad visos 12 grupių rodytųsi pilnai, net be sužaistų rungtynių)
  for (const [g, teams] of Object.entries(GROUP_TEAMS)) {
    groups[g] = {};
    for (const t of teams) {
      groups[g][normTeam(t)] = { team: t, P: 0, W: 0, D: 0, L: 0, GF: 0, GA: 0, Pts: 0 };
    }
  }

  // 2) Pridedame BAIGTŲ grupių rungtynių rezultatus
  for (const ev of events) {
    const g = groupOf(ev);
    if (!g) continue;                                   // tik grupių etapas
    if (matchStatus(ev) !== 'done' || !hasScore(ev)) continue;
    const H = groups[g][normTeam(ev.strHomeTeam)];
    const A = groups[g][normTeam(ev.strAwayTeam)];
    if (!H || !A) continue;                             // apsauga (nesutampa vardas)
    const hs = parseInt(ev.intHomeScore, 10);
    const as = parseInt(ev.intAwayScore, 10);
    H.P++; A.P++; H.GF += hs; H.GA += as; A.GF += as; A.GA += hs;
    if (hs > as)      { H.W++; H.Pts += 3; A.L++; }
    else if (hs < as) { A.W++; A.Pts += 3; H.L++; }
    else              { H.D++; A.D++; H.Pts++; A.Pts++; }
  }

  // 3) Surūšiuojame kiekvieną grupę: taškai → įvarčių skirtumas → įmušti įvarčiai
  const sorted = {};
  Object.keys(groups).sort().forEach(g => {
    sorted[g] = Object.values(groups[g]).sort((a, b) =>
      b.Pts - a.Pts ||
      (b.GF - b.GA) - (a.GF - a.GA) ||
      b.GF - a.GF ||
      a.team.localeCompare(b.team)
    );
  });
  return sorted;
}

// --- „Kita rungtynė" herojaus kortelė su atgaliniu laikrodžiu ---
function fmtCountdown(ms) {
  if (ms <= 0) return 'jau prasideda!';
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  if (d > 0) return `po ${d} d. ${h} val.`;
  return `po ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
}
let heroTimer = null;
function stopHeroTimer() { if (heroTimer) { clearInterval(heroTimer); heroTimer = null; } }
function startHeroTimer(targetMs) {
  stopHeroTimer();
  const tick = () => {
    const c = el('heroCount');
    if (!c) { stopHeroTimer(); return; }          // kortelė dingo – stabdom
    c.textContent = fmtCountdown(targetMs - Date.now());
  };
  tick();
  heroTimer = setInterval(tick, 1000);
}
// Artimiausios (dar neprasidėjusios) rungtynės kortelė
function heroCard(ev) {
  const d = kickoffDate(ev);
  const g = groupOf(ev);
  const stage = g ? `${esc(g)} grupė` : (ev._ko ? esc(koRoundName(ev._ko)) : esc(koRoundByDate(ev)));
  const hype = computeHype(ev);
  const od = winProbs(ev);
  const city = eventCity(ev);
  const cityTxt = city ? ` · 📍 ${esc(city)}` : '';
  const mid = od
    ? `<div class="hero-mid"><span class="hero-p ph">${od.est ? '≈' : ''}${od.ph}%</span><span class="hero-x">:</span><span class="hero-p pa">${od.pa}%</span></div>`
    : `<div class="hero-mid"><span class="hero-vs">VS</span></div>`;
  return `<div class="hero">
    <div class="hero-top"><span class="hero-label">⚡ Artimiausios rungtynės · ${stage}</span><span class="hype ${hypeClass(hype)}">🔥 ${hype}</span></div>
    <div class="hero-body">
      <div class="hero-team"><span class="hero-flag">${flagEmoji(ev.strHomeTeam)}</span><span class="hero-nm">${esc(ev.strHomeTeam)}</span></div>
      ${mid}
      <div class="hero-team"><span class="hero-flag">${flagEmoji(ev.strAwayTeam)}</span><span class="hero-nm">${esc(ev.strAwayTeam)}</span></div>
    </div>
    <div class="hero-meta">🕒 ${esc(dayLabel(vilniusKey(d), d))} · ${esc(vilniusTime(d))} (LT)${cityTxt}<span class="hero-count" id="heroCount">${esc(fmtCountdown(d.getTime() - Date.now()))}</span></div>
  </div>`;
}

// 10.1 RUNGTYNĖS
function renderMatches() {
  const wrap = el('matchesList');
  if (STATE.loading || STATE.error) { stopHeroTimer(); wrap.innerHTML = ''; return; }

  // Tik tikros (ne TBD) rungtynės su žinomu laiku
  let list = STATE.events.filter(ev =>
    isRealTeam(ev.strHomeTeam) && isRealTeam(ev.strAwayTeam) && kickoffDate(ev)
  );
  // Skaidome pagal filtrą: „Būsimos" (būsimos + vykstančios) / „Pasibaigusios"
  const finished = STATE.matchFilter === 'finished';
  list = list.filter(ev => {
    const st = matchStatus(ev);
    return finished ? st === 'done' : (st === 'upcoming' || st === 'live');
  });

  // „Kita rungtynė" – herojaus kortelė (tik Būsimose): artimiausia dar neprasidėjusi
  let heroHtml = '', heroEv = null;
  if (!finished) {
    heroEv = list.filter(ev => matchStatus(ev) === 'upcoming')
      .sort((a, b) => kickoffDate(a) - kickoffDate(b))[0] || null;
    if (heroEv) { heroHtml = heroCard(heroEv); list = list.filter(ev => ev !== heroEv); }
  }

  if (!list.length && !heroHtml) {
    stopHeroTimer();
    wrap.innerHTML = `<div class="empty">${finished
      ? 'Baigtų rungtynių dar nėra.'
      : 'Artimiausių rungtynių nerasta.'}<br>Spausk „Atnaujinti" arba bandyk vėliau.</div>`;
    return;
  }

  let body = '';
  if (STATE.sortMode === 'hype') {
    // Pagal hype (didžiausias viršuje), be dienų grupavimo
    list.sort((a, b) => computeHype(b) - computeHype(a));
    body = list.map(ev => matchCard(ev, true)).join('');
  } else {
    // Pagal laiką: būsimos – didėjančia, pasibaigusios – mažėjančia (naujausios viršuje)
    list.sort((a, b) => finished ? kickoffDate(b) - kickoffDate(a) : kickoffDate(a) - kickoffDate(b));
    let lastDay = null;
    for (const ev of list) {
      const d = kickoffDate(ev);
      const key = vilniusKey(d);
      if (key !== lastDay) { body += `<div class="day-head">${esc(dayLabel(key, d))}</div>`; lastDay = key; }
      body += matchCard(ev);
    }
  }
  wrap.innerHTML = heroHtml + body;
  if (heroEv) startHeroTimer(kickoffDate(heroEv).getTime()); else stopHeroTimer();
}

// Vienos rungtynių kortelės HTML
function matchCard(ev, showDay = false) {
  const status = matchStatus(ev);
  const d = kickoffDate(ev);
  const g = groupOf(ev);
  const hype = computeHype(ev);

  // Statusas rodomas TIK kai vyksta (live). Būsimoms laiką, baigtoms rezultatą
  // rodo pati kortelė – tad nereikia papildomo „Būsima"/„Baigta" ženkliuko.
  const statusPill = (status === 'live') ? `<span class="pill live">VYKSTA</span>` : '';

  // Grupės arba atkrintamųjų etapo ženkliukas
  const stagePill = g
    ? `<span class="pill group">${esc(g)} grupė</span>`
    : `<span class="pill ko">${esc(ev._ko ? koRoundName(ev._ko) : koRoundByDate(ev))}</span>`;

  // Rezultatas (jei baigta/vyksta) arba tuščia. Baudiniai – mažu skaičiumi „(4)".
  const showScore = (status === 'done' || status === 'live') && hasScore(ev);
  const pens = showScore && wentToPens(ev);
  const penTag = (v) => pens ? ` <span class="pen">(${esc(v)})</span>` : '';
  const hs = showScore ? esc(ev.intHomeScore) + penTag(ev.intHomeScoreExtra) : '';
  const as = showScore ? esc(ev.intAwayScore) + penTag(ev.intAwayScoreExtra) : '';
  const winSide = showScore ? koWinnerSide(ev) : null;
  const homeWin = winSide === 'home';
  const awayWin = winSide === 'away';

  // Laiko eilutė. Rūšiuojant pagal laiką dieną rodo antraštė (kortelėje tik laikas);
  // pagal hype (antraščių nėra) – rodom dieną. Atkrintamosioms pridedame miestą.
  const city = eventCity(ev);
  const cityTxt = city ? ` · 📍 ${esc(city)}` : '';
  const when = showDay
    ? `<div class="when">🕒 <span class="t">${esc(dayLabel(vilniusKey(d), d))}</span> · ${esc(vilniusTime(d))} (LT)${cityTxt}</div>`
    : `<div class="when">🕒 <span class="t">${esc(vilniusTime(d))}</span> (LT)${cityTxt}</div>`;

  // Laimėjimo tikimybės – tik dar nesužaistoms. Grupių etapas: 3-krypčių (1/X/2).
  // Atkrintamosios: 2-krypčių „kas pereina toliau" (be lygiųjų). Jei realių
  // koeficientų nėra – atkrintamosioms rodome įvertį pagal reitingus („≈").
  const od = (status !== 'done') ? winProbs(ev) : null;
  let homeRight, awayRight, probs = '';
  if (showScore) {
    homeRight = `<span class="score">${hs}</span>`;
    awayRight = `<span class="score">${as}</span>`;
  } else if (od && od.twoWay) {
    const mark = od.est ? `<span class="est">≈</span>` : '';
    homeRight = `<span class="winp ph">${mark}${od.ph}%</span>`;
    awayRight = `<span class="winp pa">${od.pa}%</span>`;
    probs = `<div class="probs">
      <div class="pbar two"><i class="ph" style="width:${od.ph}%"></i><i class="pa" style="width:${od.pa}%"></i></div>
      <div class="xdraw">${od.est ? 'Įvertis pagal reitingus' : 'Tikimybė žengti toliau'}</div>
    </div>`;
  } else if (od) {
    homeRight = `<span class="winp ph">${od.ph}%</span>`;
    awayRight = `<span class="winp pa">${od.pa}%</span>`;
    probs = `<div class="probs">
      <div class="pbar"><i class="ph" style="width:${od.ph}%"></i><i class="pd" style="width:${od.pd}%"></i><i class="pa" style="width:${od.pa}%"></i></div>
      <div class="xdraw">Lygiosios (X) · ${od.pd}%</div>
    </div>`;
  } else {
    homeRight = ''; awayRight = '';
  }

  // Baudinių užrašas (kad būtų aišku, kas perėjo po lygiųjų)
  const penNote = pens
    ? `<div class="pen-note">⚽ Po baudinių (${esc(ev.intHomeScoreExtra)}:${esc(ev.intAwayScoreExtra)}) toliau žengia <b>${esc(koWinnerName(ev))}</b></div>`
    : '';

  return `<div class="match">
    <div class="top">
      <span class="meta-left">${stagePill}${statusPill}</span>
      <span class="hype ${hypeClass(hype)}">🔥 ${hype}</span>
    </div>
    <div class="teams">
      <div class="team-row">
        <span class="team ${homeWin ? 'win' : ''}">${teamLogo(ev.strHomeTeam, ev.strHomeTeamBadge)}<span class="name">${esc(ev.strHomeTeam)}</span><span class="rank-chip">#${teamRank(ev.strHomeTeam)}</span></span>
        ${homeRight}
      </div>
      <div class="team-row">
        <span class="team ${awayWin ? 'win' : ''}">${teamLogo(ev.strAwayTeam, ev.strAwayTeamBadge)}<span class="name">${esc(ev.strAwayTeam)}</span><span class="rank-chip">#${teamRank(ev.strAwayTeam)}</span></span>
        ${awayRight}
      </div>
    </div>
    ${probs}
    ${penNote}
    ${when}
  </div>`;
}

// 10.2 LENTELĖS
function renderTables() {
  const wrap = el('tablesList');
  if (STATE.loading || STATE.error) { wrap.innerHTML = ''; return; }

  const groupKeys = Object.keys(STATE.groups);
  if (!groupKeys.length) {
    wrap.innerHTML = `<div class="empty">Grupių lentelių dar nėra.<br>Jos atsiras, kai bus paskelbtos grupių etapo rungtynės.</div>`;
    return;
  }

  wrap.innerHTML = groupKeys.map(g => {
    const rows = STATE.groups[g].map((t, i) => {
      const pos = i + 1;
      const cls = pos <= 2 ? 'adv' : pos === 3 ? 'maybe' : '';
      return `<tr class="${cls}">
        <td class="pos">${pos}</td>
        <td class="team-cell"><span class="tc">${logoFor(t.team)}<span class="nm">${esc(t.team)}</span></span></td>
        <td>${t.P}</td><td>${t.W}</td><td>${t.D}</td><td>${t.L}</td>
        <td>${t.GF}:${t.GA}</td>
        <td class="pts">${t.Pts}</td>
      </tr>`;
    }).join('');

    return `<div class="group-card">
      <div class="group-title"><span class="accent">${esc(g)}</span> grupė</div>
      <table class="tbl">
        <colgroup><col class="c-pos"><col><col class="c-stat"><col class="c-stat"><col class="c-stat"><col class="c-stat"><col class="c-gf"><col class="c-pts"></colgroup>
        <thead><tr>
          <th class="pos"></th><th class="team-cell">Komanda</th>
          <th>Ž</th><th>P</th><th>L</th><th>Pr</th><th>Įv</th><th>Tšk</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');
}

// 10.3 TINKLELIS (bracket) — klasikinis horizontalus medis.
//    R32 poros žinomos (grupių etapas baigtas). Tolesni etapai užsipildo
//    automatiškai: kiekvienos poros komanda = ankstesnių rungtynių laimėtojas
//    (rezultatai imami iš API). Pozicijas skaičiuojame patys (absoliutus
//    išdėstymas), kad jungiamosios linijos būtų tikslios.

// Atkrintamųjų įvykis pagal rungtynių numerį (egzistuoja tik R32 – kaip įvykiai)
function koEventByNum(n) { return STATE.events.find(e => e._ko === n); }
// Pralaimėtojas (dėl 3 vietos) – kai pora sužaista ir aiškus nugalėtojas
function koLoser(m) {
  if (!m || !m.done || !m.winner) return null;
  return m.winner === m.home ? m.away : m.home;
}

// Baudinių rezultatas konkrečiai komandai (arba null, jei nebuvo baudinių)
function penFor(ev, teamName) {
  if (!ev || !wentToPens(ev)) return null;
  if (normTeam(teamName) === normTeam(ev.strHomeTeam)) return ev.intHomeScoreExtra;
  if (normTeam(teamName) === normTeam(ev.strAwayTeam)) return ev.intAwayScoreExtra;
  return null;
}
// Sudaro vieną tinklelio įrašą iš įvykio (orientacija pagal home/away vardus).
// Grąžina: { home, away, hKnown, aKnown, hs, as, hp, ap, status, done, winner }
function koEntry(home, away, ev, hKnown = true, aKnown = true) {
  const st = ev ? matchStatus(ev) : 'upcoming';
  const done = !!(ev && st === 'done' && hasScore(ev));
  const wn = done ? koWinnerName(ev) : null;
  const winner = wn ? (normTeam(wn) === normTeam(home) ? home : away) : null;
  // rezultatą pateikiam home/away orientacija (vardas gali būti namų ar svečių API pusėje)
  const sameOrient = ev ? normTeam(ev.strHomeTeam) === normTeam(home) : true;
  const hs = ev ? (sameOrient ? ev.intHomeScore : ev.intAwayScore) : null;
  const as = ev ? (sameOrient ? ev.intAwayScore : ev.intHomeScore) : null;
  return {
    home, away, hKnown, aKnown,
    hs, as, hp: penFor(ev, home), ap: penFor(ev, away),
    status: st, done, winner,
  };
}
// Sudaro visą tinklelį: numeris -> įrašas (žr. koEntry)
function koResolve() {
  const R = {};
  // 1) R32 – komandos iš tinklelio; rezultatai iš (su API sulietų) sintetinių įvykių
  for (const r of KO_R32) R[r.m] = koEntry(r.h, r.a, koEventByNum(r.m));
  // 2) 1/8 -> Finalas: komandos = maitintojų laimėtojai; rezultatas iš API pagal porą
  for (const n of [89, 90, 91, 92, 93, 94, 95, 96, 97, 98, 99, 100, 101, 102, 104, 103]) {
    const [f1, f2] = KO_NEXT[n];
    const takeLoser = (n === 103); // dėl 3 vietos – pusfinalių PRALAIMĖTOJAI
    const t1 = takeLoser ? koLoser(R[f1]) : (R[f1] ? R[f1].winner : null);
    const t2 = takeLoser ? koLoser(R[f2]) : (R[f2] ? R[f2].winner : null);
    const api = (t1 && t2 && STATE.koApi) ? STATE.koApi.get(pairKey(t1, t2)) : null;
    R[n] = (t1 && t2)
      ? koEntry(t1, t2, api, true, true)
      : { home: t1, away: t2, hKnown: !!t1, aKnown: !!t2, hs: null, as: null, hp: null, ap: null, status: 'upcoming', done: false, winner: null };
  }
  return R;
}

// Viena jungiamoji linija (absoliučios koordinatės)
function bkLine(x1, y1, x2, y2) {
  const left = Math.min(x1, x2), top = Math.min(y1, y2);
  const w = Math.max(2, Math.abs(x2 - x1)), h = Math.max(2, Math.abs(y2 - y1));
  return `<div class="bk-line" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px;"></div>`;
}
// Viena tinklelio kortelės eilutė (komanda)
function bkSlot(m, side, num, probH, probA) {
  const known = side === 'home' ? m.hKnown : m.aKnown;
  const name = side === 'home' ? m.home : m.away;
  const score = side === 'home' ? m.hs : m.as;
  const pen = side === 'home' ? m.hp : m.ap;   // baudinių rezultatas (jei buvo)
  const isWin = m.done && m.winner && m.winner === name;
  const isLoseDone = m.done && m.winner && m.winner !== name;
  const flag = known ? flagEmoji(name) : '';
  const label = known ? esc(name) : '—';
  let right = '';
  if (score != null && score !== '') {
    const penTxt = (pen != null && pen !== '') ? ` <span class="bk-pen">(${esc(pen)})</span>` : '';
    right = `<span class="bk-sc">${esc(score)}${penTxt}</span>`;
  } else if (!m.done && known) {
    const p = side === 'home' ? probH : probA; if (p != null) right = `<span class="bk-pct">${p}%</span>`;
  }
  return `<div class="bk-slot ${isWin ? 'win' : ''} ${isLoseDone ? 'lose' : ''} ${known ? '' : 'tbd'}">
    <span class="flag">${flag}</span><span class="bk-nm">${label}</span>${right}</div>`;
}
// Kortelė (su pozicija) arba „plokščia" (dėl 3 vietos)
function bkTie(m, num, style) {
  let probH = null, probA = null;
  if (m && !m.done && m.hKnown && m.aKnown) {
    const p = winProbs({ strHomeTeam: m.home, strAwayTeam: m.away, _ko: num });
    if (p && p.twoWay) { probH = p.ph; probA = p.pa; }
  }
  const safe = m || { hKnown: false, aKnown: false };
  return `<div class="bk-tie" style="${style}">${bkSlot(safe, 'home', num, probH, probA)}${bkSlot(safe, 'away', num, probH, probA)}</div>`;
}

function renderBracket() {
  const R = koResolve();
  el('bracketNote').innerHTML =
    '<b>Atkrintamosios.</b> 1/16 finalo poros aiškios — grupių etapas baigtas. Vėlesni etapai užsipildo automatiškai, kai sužaidžiamos rungtynės. ' +
    'Procentai — tikimybė žengti toliau (realūs koeficientai; „≈" — įvertis). Slinkite į šoną ir žemyn →';

  // Geometrija
  const TIE_H = 58, ROW_GAP = 16, COL_W = 166, COL_GAP = 34, HEAD_H = 42;
  const rowH = TIE_H + ROW_GAP;
  const n0 = BRACKET_COLS[0].nums.length;          // 16
  const totalH = n0 * rowH;
  // Kiekvieno stulpelio kortelių CENTRAI (y)
  const centers = [];
  BRACKET_COLS.forEach((col, ci) => {
    centers[ci] = ci === 0
      ? col.nums.map((_, i) => i * rowH + rowH / 2)
      : col.nums.map((_, i) => (centers[ci - 1][2 * i] + centers[ci - 1][2 * i + 1]) / 2);
  });

  const W = BRACKET_COLS.length * COL_W + (BRACKET_COLS.length - 1) * COL_GAP;
  let lines = '', cards = '';

  BRACKET_COLS.forEach((col, ci) => {
    const x = ci * (COL_W + COL_GAP);
    // Stulpelio antraštė
    cards += `<div class="bk-head" style="left:${x}px;width:${COL_W}px;">${esc(col.title)}<span>${esc(col.sub)}</span></div>`;
    col.nums.forEach((num, i) => {
      const cy = HEAD_H + centers[ci][i];
      cards += bkTie(R[num], num, `left:${x}px;top:${cy - TIE_H / 2}px;width:${COL_W}px;height:${TIE_H}px;`);
      // Jungiamosios linijos į kitą stulpelį
      if (ci < BRACKET_COLS.length - 1) {
        const rightX = x + COL_W, midX = rightX + COL_GAP / 2;
        const ncy = HEAD_H + centers[ci + 1][Math.floor(i / 2)];
        lines += bkLine(rightX, cy, midX, cy);            // horizontali nuo kortelės
        lines += bkLine(midX, cy, midX, ncy);             // vertikali iki poros vidurio
        if (i % 2 === 0) lines += bkLine(midX, ncy, rightX + COL_GAP, ncy); // į kitą kortelę
      }
    });
  });

  // Dėl 3-ios vietos — atskira kortelė po medžiu
  const third = `<div class="bk-third">
      <div class="bk-third-h">Dėl 3-ios vietos · liepos 18</div>
      ${bkTie(R[103], 103, '')}
    </div>`;

  el('bracketRounds').innerHTML =
    `<div class="bk-wrap"><div class="bk-canvas" style="width:${W}px;height:${totalH + HEAD_H}px;">${lines}${cards}</div></div>${third}`;
}

// 10.35 REITINGAI (FIFA reitingai + HYPE paaiškinimas)
function renderRankings() {
  el('hypeInfo').innerHTML = `<b>Kaip skaičiuojamas HYPE 🔥 (1–100)?</b><br>
    Bazė: kuo stipresnės ABI komandos (pagal FIFA reitingą), tuo daugiau taškų.
    Pridedama <b>+</b> už „didžiąsias" komandas (Argentina, Prancūzija, Brazilija, Anglija,
    Ispanija, Portugalija, Vokietija, Nyderlandai) ir <b>+</b> už atkrintamųjų arba
    lemiamo (3‑io) grupės turo rungtynes. Spalva: žalia (rami) → geltona → raudona (karšta).
    <br><br><b>FIFA reitingai</b> (2026‑06) — pagal juos skaičiuojamas HYPE:`;

  // Visi 48 dalyviai, surūšiuoti pagal reitingą
  const teams = [];
  for (const list of Object.values(GROUP_TEAMS)) for (const t of list) teams.push(t);
  teams.sort((a, b) => teamRank(a) - teamRank(b) || a.localeCompare(b));
  el('rankingsList').innerHTML = teams.map(t =>
    `<div class="rk-row"><span class="rkpos">${teamRank(t)}</span>${logoFor(t)}<span class="nm">${esc(t)}</span></div>`
  ).join('');
}

// 10.4 PORAŠTĖ / DIAGNOSTIKA
function renderDiag() {
  const d = el('diag');
  if (STATE.loading) { d.innerHTML = ''; return; }
  if (STATE.error) {
    d.innerHTML = `<code>${CONFIG.VERSION}</code> · Šaltinis: <code>TheSportsDB</code> · Lyga <code>${CONFIG.LEAGUE_ID}</code> · Bandyta: ${esc(STATE.diagTried.join(', '))}`;
    return;
  }
  d.innerHTML = `<code>${CONFIG.VERSION}</code> · Šaltinis: <code>TheSportsDB</code> · Lyga <code>${CONFIG.LEAGUE_ID}</code> · ` +
    `Sezonas <code>${esc(STATE.season || '—')}</code> · Endpointas <code>${esc(STATE.endpointUsed || '—')}</code> · ` +
    `Įvykių: <code>${STATE.events.length}</code> · Koef.: <code>${Object.keys(STATE.odds || {}).length}</code>`;
}

// Viską perpiešiame iš naujo
function renderAll() {
  renderStatus();
  renderMatches();
  renderTables();
  renderBracket();
  renderRankings();
  renderDiag();
}

// --------------------------------------------------------------------
// 11. SĄVEIKA (tab'ai, rūšiavimas, atnaujinimas)
// --------------------------------------------------------------------
function switchTab(name) {
  STATE.activeTab = name;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(s => s.classList.toggle('active', s.id === 'tab-' + name));
}
function setRefreshing(on) {
  const b = el('refreshBtn');
  b.disabled = on;
  b.innerHTML = on ? `<span class="spinner"></span> Atnaujinama…` : 'Atnaujinti';
}

// Mygtukų / tab'ų klausymas
el('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (t) switchTab(t.dataset.tab);
});
el('sortSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  STATE.sortMode = b.dataset.sort;
  document.querySelectorAll('#sortSeg button').forEach(x => x.classList.toggle('active', x === b));
  renderMatches();
});
el('filterSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  STATE.matchFilter = b.dataset.filter;
  document.querySelectorAll('#filterSeg button').forEach(x => x.classList.toggle('active', x === b));
  renderMatches();
});
el('refreshBtn').addEventListener('click', () => { if (!STATE.loading) loadData(); });

// --------------------------------------------------------------------
// 12. STARTAS
// --------------------------------------------------------------------
function init() {
  // Šios dienos data antraštėje (Lietuvos laiku)
  el('todayDate').textContent = vilniusLongDate(new Date());
  loadData(); // iškart bandome įkelti duomenis
}
init();
</script>
